<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Heart N Soul private chef menus: multi-course dinners and brunch cooked in your home." />
  <title>Private Chef Menus | Heart N Soul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/chef-menu.css" />
</head>
<body>
  <header class="site-header"></header>

  <main>
    <section class="page-hero center">
      <div class="container">
        <span class="eyebrow">Private Chef</span>
        <h1>Dinner, cooked in your home.</h1>
        <p class="lead">Pick a themed menu, choose your courses and see your price instantly. Every menu is made fresh on-site.</p>
        <hr class="divider" />
      </div>
    </section>

    <section class="section-tight" style="padding-bottom:96px">
      <!-- Cards are built from js/menus.js -->
      <div class="container menu-cards" id="menu-cards"></div>
    </section>
  </main>

  <footer class="site-footer"></footer>
  <script src="js/site.js"></script>
  <script src="js/menus.js"></script>
  <script>
    (function () {
      function money(n) { return "$" + (n % 1 ? n.toFixed(2) : n); }
      document.getElementById("menu-cards").innerHTML = Object.keys(MENUS).map(function (k) {
        var m = MENUS[k];
        var from = m.prixFixe ? "Prix fixe " + money(m.prixFixe) + " per adult"
                              : "Entrees from " + money(m.prices.en) + " per adult";
        return '<a class="card card-link menu-card" href="' + m.page + '">' +
          '<div class="media">' + (m.video
            ? '<video src="' + m.video + '" poster="' + m.photo + '" autoplay muted loop playsinline aria-hidden="true"></video>'
            : '<img src="' + m.photo + '" alt="" onerror="this.remove()" />') + '</div>' +
          "<h3>" + m.name + "</h3>" +
          '<p class="from">' + from + " &middot; $" + m.min + " minimum</p>" +
          '<div class="badges">' + (m.tags || []).map(function (t) {
            return '<span class="badge' + (t === "kid" ? "" : " diet") + '">' + TAGS[t] + "</span>";
          }).join("") + "</div>" +
          "<p>" + m.desc + "</p>" +
          '<span class="btn btn-outline">View menu</span></a>';
      }).join("");
    })();
  </script>
</body>
</html>
